services:
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    environment:
      # ── Switch to Node.js backend on 4000 ──
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_TURBOPACK=false
    depends_on:
      - api

  # ── Node.js API (migration target) ─────────────────────────────
  api:
    build: ./services/api
    container_name: autotest-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/autotestdb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SALESFORCE_ENCRYPTION_KEY=${SALESFORCE_ENCRYPTION_KEY}
      - SALESFORCE_REDIRECT_URI=${SALESFORCE_REDIRECT_URI}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Python backend (kept alive during migration) ────────────────
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/autotestdb
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - SALESFORCE_ENCRYPTION_KEY=${SALESFORCE_ENCRYPTION_KEY}
      - SALESFORCE_REDIRECT_URI=${SALESFORCE_REDIRECT_URI}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: autotest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autotestdb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autotestdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

volumes:
  postgres_data:

